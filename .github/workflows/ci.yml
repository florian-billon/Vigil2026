name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
          override: true
      
      - name: Rustfmt check
        run: cd server && cargo fmt --check
      
      - name: Clippy check
        run: cd server && cargo clippy -- -D warnings
      
      - name: Run Rust tests
        run: cd server && cargo test
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-web/package-lock.json
      
      - name: Install web dependencies
        run: cd client-web && npm ci
      
      - name: ESLint check
        run: cd client-web && npm run lint
      
      - name: Prettier check
        run: cd client-web && npx prettier --check .
      
      - name: Setup Node.js for desktop
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-desktop/package-lock.json
      
      - name: Install desktop dependencies
        run: cd client-desktop && npm ci

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build server
        run: cd server && cargo build --release
      
      - name: Build web client
        run: |
          cd client-web
          npm ci
          npm run build
      
      - name: Build desktop client
        run: |
          cd client-desktop
          npm ci
          npm run build
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            server/target/coverage/
            client-web/coverage/

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build release artifacts
        run: |
          cd server && cargo build --release
          cd ../client-web && npm ci && npm run build
          cd ../client-desktop && npm ci && npm run tauri build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            server/target/release/vigil-server
            client-desktop/src-tauri/target/release/bundle/