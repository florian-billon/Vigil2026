version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vigil-db
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vigil-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://vigil:vigil@db:5432/vigil
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/target

  client_web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    container_name: vigil-web
    ports:
      - "8081:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - server
    volumes:
      - ./client-web:/app
      - /app/node_modules
      - /app/.next

  client_desktop:
    build:
      context: ./client-desktop
      dockerfile: Dockerfile
    container_name: vigil-desktop-build
    volumes:
      - ./client-desktop:/app
      - ./client-desktop/src-tauri/target:/app/src-tauri/target
      - desktop_dist:/app/dist
    depends_on:
      - client_web

volumes:
  postgres_data:
  desktop_dist: